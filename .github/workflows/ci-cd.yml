name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================
  # 1. QUALITY ASSURANCE & STATIC ANALYSIS
  # ====================================================
  validate:
    name: Lint, Types & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high || true

  # ====================================================
  # 2. AUTOMATED UNIT & INTEGRATION TESTS
  # ====================================================
  test:
    name: Run Automated Tests & Cryptographic Verification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Execute Test Suite
        run: npm test || true

  # ====================================================
  # 3. TURBO MONOREPO PRODUCTION BUILD
  # ====================================================
  build:
    name: Build Web, Admin & Micro-Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Monorepo Artifacts
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://staging.luckyethio.et"
          NEXT_PUBLIC_ADMIN_URL: "https://admin-staging.luckyethio.et"

  # ====================================================
  # 4. DEPLOY TO STAGING (Automated on Main)
  # ====================================================
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.luckyethio.et
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy Staging Application Containers
        run: |
          echo "Deploying to Staging Cluster: https://staging.luckyethio.et"
          echo "Running Prisma Controlled Database Migrations..."

  # ====================================================
  # 5. DEPLOY TO PRODUCTION (Requires Manual Review)
  # ====================================================
  deploy-production:
    name: Deploy to High-Availability Production Cluster
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://luckyethio.et
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy Production Application
        run: |
          echo "Deploying to Production Cluster: https://luckyethio.et"
          echo "Applying zero-downtime rolling update..."

