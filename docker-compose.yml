version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Production Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: luckyethio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luckyethio_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luckyethio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Distributed Lock Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: luckyethio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ----------------------------------------------------------------------------
  # 3. Customer & Agent Web Application (Port 3000)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
    container_name: luckyethio_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-luckyethio_secure_password_2026}@postgres:5432/${POSTGRES_DB:-luckyethio_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-generate_secure_random_key}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY}
      CBE_BIRR_API_KEY: ${CBE_BIRR_API_KEY}
      SANTIMPAY_PRIVATE_KEY: ${SANTIMPAY_PRIVATE_KEY}

volumes:
  postgres_data:
  redis_data:

